name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Install Java for RTDB emulator
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jre-headless

      - name: Rules tests
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-larry "npx vitest run --config vitest.rules.config.ts"
