name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Install Java for RTDB emulator
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jre-headless

      - name: Rules tests
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-larry "npx vitest run --config vitest.rules.config.ts"
