name: Scrape and publish

on:
  schedule:
    - cron: "10 6 * * 1,3" # 08:10 CEST / 07:10 CET, Mo+Mi
    - cron: "10 9 * * 1,3" # 11:10 CEST / 10:10 CET, Mo+Mi
    - cron: "30 9 * * 1,3" # 11:30 CEST / 10:30 CET, last check before lunch
    - cron: "10 6 * * 2,4" # Di+Do catch-up if still incomplete
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    env:
      TZ: Europe/Berlin
      PREV_MENU_URL: https://herr-schulz.github.io/lunchtime-larry/data/menu.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Should scrape?
        id: gate
        run: npx tsx scrape/shouldRun.ts

      - name: Playwright version
        if: steps.gate.outputs.needed == 'true'
        id: pw
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.gate.outputs.needed == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.gate.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium deps
        if: steps.gate.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run scrape
        if: steps.gate.outputs.needed == 'true'
        id: scrape

      - id: ready
        if: always()
        run: |
          if [ -f site/data/menu.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-debug
          path: debug/
          if-no-files-found: ignore

      - run: npm run stamp
        if: always() && steps.ready.outputs.ready == 'true'

      - name: Deploy Firebase Hosting
        if: always() && steps.ready.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning::No FIREBASE_TOKEN — web.app keeps its last hosting upload. Pages still gets the new menu."
            exit 0
          fi
          npx --yes firebase-tools@13 deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.ready.outputs.ready == 'true'
        with:
          path: site

  deploy:
    needs: scrape
    if: needs.scrape.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
