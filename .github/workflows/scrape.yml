name: Scrape and publish

on:
  # No GitHub `schedule`. That queue delays/drops runs (Mon 2026-09-07 / 2026-09-14).
  # Clock is a Cursor automation that POSTs workflow_dispatch.
  workflow_dispatch:
    inputs:
      retry:
        description: Once-only follow-up after empty canteen days
        type: boolean
        default: false
  repository_dispatch:
    types: [scrape]
  push:
    branches: [main]
    paths:
      - ".github/trigger-scrape"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      holes: ${{ steps.scrape.outputs.holes }}
    env:
      TZ: Europe/Berlin
      PREV_MENU_URL: https://herr-schulz.github.io/lunchtime-larry/data/menu.json
      FORCE_SCRAPE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'push') && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cron probe
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u -Iseconds)"
          echo "berlin=$(TZ=Europe/Berlin date -Iseconds)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Should scrape?
        id: gate
        run: npx tsx scrape/shouldRun.ts

      - name: Playwright version
        if: steps.gate.outputs.needed == 'true'
        id: pw
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.gate.outputs.needed == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.gate.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium deps
        if: steps.gate.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run scrape
        if: steps.gate.outputs.needed == 'true'
        id: scrape

      - id: ready
        if: always()
        run: |
          if [ -f site/data/menu.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scrape-debug
          path: debug/
          if-no-files-found: ignore

      - run: npm run stamp
        if: always() && steps.ready.outputs.ready == 'true'

      - run: node scripts/fetch-aufrufe.mjs
        if: always() && steps.ready.outputs.ready == 'true'

      - name: Auth Google Cloud (Hosting only)
        id: auth
        if: always() && steps.ready.outputs.ready == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != ''
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Deploy Firebase Hosting
        if: always() && steps.ready.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Prefer WIF (Hosting Admin SA). Fall back to legacy CI token for hosting only.
          # Database rules are never deployed from this workflow.
          if [ "${{ steps.auth.outcome }}" = "success" ]; then
            npx --yes firebase-tools@13 deploy --only hosting --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "::notice::Using FIREBASE_TOKEN fallback for hosting-only deploy. Prefer GCP_WIF_PROVIDER + GCP_SA_EMAIL."
            npx --yes firebase-tools@13 deploy --only hosting --non-interactive
          else
            echo "::warning::No WIF vars and no FIREBASE_TOKEN — web.app keeps its last hosting upload. Pages still gets the new menu."
            exit 0
          fi

      # Pages serves only data/menu.json plus redirects to lunchtime-larry.web.app.
      - run: node scripts/build-pages-dist.mjs
        if: always() && steps.ready.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: always() && steps.ready.outputs.ready == 'true'
        with:
          path: pages-dist

  refill:
    needs: scrape
    if: needs.scrape.outputs.holes == 'true' && github.event.inputs.retry != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for the kitchen
        run: sleep 480
      - name: Kick one follow-up scrape
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref "${GITHUB_REF_NAME}" -f retry=true

  deploy:
    needs: scrape
    if: needs.scrape.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
