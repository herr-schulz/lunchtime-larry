name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/stamp-assets.mjs"
      - "scripts/build-pages-dist.mjs"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PREV_MENU_URL: https://herr-schulz.github.io/lunchtime-larry/data/menu.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Restore current menu
        run: |
          mkdir -p site/data
          if curl -fsSL "$PREV_MENU_URL" -o site/data/menu.json; then
            echo "restored menu.json"
          else
            echo "no live menu — deploying the board without it"
            rm -f site/data/menu.json
          fi

      - run: npm run stamp

      # Pages serves only data/menu.json plus redirects to lunchtime-larry.web.app.
      - run: node scripts/build-pages-dist.mjs

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
